name: Build PalmGlide

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: PalmGlide-Windows
          path: dist/PalmGlide/

  linux:
    name: Linux app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Build
        run: ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: PalmGlide-Linux
          path: dist/PalmGlide/
