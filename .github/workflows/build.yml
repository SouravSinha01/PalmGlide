name: Build PalmGlide

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: PalmGlide-Windows
          path: dist/PalmGlide/

  linux:
    name: Linux app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Build
        run: ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: PalmGlide-Linux
          path: dist/PalmGlide/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: PalmGlide-Windows
          path: release/PalmGlide-Windows
      - uses: actions/download-artifact@v7
        with:
          name: PalmGlide-Linux
          path: release/PalmGlide-Linux
      - name: Create release archives
        working-directory: release
        run: |
          zip -r PalmGlide-Windows.zip PalmGlide-Windows
          tar -czf PalmGlide-Linux.tar.gz PalmGlide-Linux
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/PalmGlide-Windows.zip \
            release/PalmGlide-Linux.tar.gz \
            --title "PalmGlide $GITHUB_REF_NAME" \
            --notes "First public PalmGlide build for Windows and Linux. Camera processing stays on your computer."
